name: CS 기초
guide: >
  기술 면접에서 바로 답할 수 있는 수준을 목표로 정리.
  핵심 개념 → 동작 원리(가능하면 표/텍스트 다이어그램) → 비교표 → 실무·코드와의 연결
  → 예상 면접 질문 3~5개와 모범 답변 순서로 작성.
topics:
  - 자료구조 개요 — 배열 vs 연결 리스트
  - 스택·큐·덱의 구현과 활용
  - 해시 테이블 — 해시 함수, 충돌 해결(체이닝, 오픈 어드레싱)
  - 트리와 이진 탐색 트리, 균형 트리(AVL, 레드-블랙)
  - 힙과 우선순위 큐
  - B-Tree와 B+Tree — DB 인덱스와의 관계
  - 정렬 알고리즘 비교 — 버블/선택/삽입/병합/퀵/힙
  - 프로세스와 스레드
  - 멀티스레딩과 동기화 — 뮤텍스, 세마포어, 모니터
  - 교착 상태(Deadlock) — 발생 조건과 해결
  - CPU 스케줄링 알고리즘
  - 메모리 관리 — 페이징, 세그멘테이션, 가상 메모리
  - 페이지 교체 알고리즘 — FIFO, LRU, LFU
  - 캐시와 지역성
  - OSI 7계층과 TCP/IP 4계층
  - TCP vs UDP, 3-way/4-way handshake
  - HTTP와 HTTPS — TLS 핸드셰이크
  - HTTP 메서드, 상태 코드, REST
  - 쿠키·세션·토큰(JWT) 인증
  - DNS와 브라우저에 URL을 입력하면 일어나는 일
  - 로드 밸런싱과 CDN
  - DB 기초 — 관계형 모델, 키, 정규화
  - SQL 조인과 서브쿼리
  - 인덱스 — 동작 원리와 언제 쓰면 안 되는지
  - 트랜잭션과 ACID, 격리 수준
  - 락과 동시성 제어 — 비관적/낙관적 락
  - NoSQL과 RDBMS 비교
  - 객체지향 4대 특성과 SOLID
  - 디자인 패턴 — 싱글톤, 팩토리, 전략, 옵저버
  - 동기/비동기, 블로킹/논블로킹
