name: 알고리즘·코딩테스트 (Python)
guide: >
  모든 예제는 Python 3, 프로그래머스 형식(def solution(...): ... return)으로 작성.
  개념 → 언제 쓰는지(문제에서 알아채는 신호) → 템플릿 코드 → 예제 문제 풀이 → 자주 하는 실수/반례
  → 시간복잡도 순서로 설명. 그림이 필요하면 텍스트 다이어그램이나 표로 표현.
topics:
  - 시간복잡도와 빅오 표기법 — 입력 크기로 허용 알고리즘 가늠하기
  - 파이썬 코테 필수 문법 — 리스트 컴프리헨션, 슬라이싱, sort key, enumerate, zip
  - collections 모듈 — deque, Counter, defaultdict 활용
  - 문자열 처리 — split/join, 아스키 코드, 회문 판별
  - 해시 — dict/set으로 탐색 O(1) 만들기
  - 스택 — 괄호 문제, 단조 스택
  - 큐와 덱 — 프로세스/다리를 지나는 트럭 유형
  - 힙(heapq) — 우선순위 큐, 최소/최대 힙
  - 정렬 — 커스텀 정렬, 안정 정렬, 가장 큰 수 유형
  - 완전탐색 — itertools 순열/조합, 중첩 반복
  - 재귀와 백트래킹 — N-Queen, 부분집합
  - DFS — 재귀/스택 구현, 방문 처리, 연결 요소
  - BFS — 최단 거리, 격자(미로) 탐색
  - 그래프 표현 — 인접 리스트 vs 인접 행렬
  - 이분 탐색 — bisect, 파라메트릭 서치
  - 투 포인터와 슬라이딩 윈도우
  - 누적합과 구간합
  - 그리디 — 증명 감각 잡기, 회의실 배정/구명보트
  - DP 기초 — 메모이제이션 vs 타뷸레이션
  - DP 유형 — 배낭 문제(0/1 knapsack)
  - DP 유형 — LIS, LCS
  - 다익스트라 — heapq 기반 최단 경로
  - 플로이드-워셜과 벨만-포드
  - 유니온 파인드 — 서로소 집합, 경로 압축
  - 최소 신장 트리 — 크루스칼, 프림
  - 위상 정렬
  - 트리 — 이진 트리 순회, 트리의 지름
  - 비트마스킹
  - 구현/시뮬레이션 — 2차원 배열 회전, 방향 벡터
  - 실전 팁 — 시간 초과 줄이기(sys.stdin, 재귀 한도), 반례 만드는 법
