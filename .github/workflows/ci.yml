name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Windows 빌드 · 테스트
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BlogStudio.sln

      - name: Build
        run: dotnet build BlogStudio.sln -c Release --no-restore

      - name: 자동 채우기 스크립트 문법 검사
        run: node --check shared/autofill/autofill.js

      - name: Test
        run: dotnet test src/BlogStudio.Core.Tests/BlogStudio.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # 테스트용 실행 파일: .NET 런타임을 함께 묶은 단일 exe (PC에 .NET 설치 불필요)
      - name: Publish (win-x64, self-contained)
        run: >-
          dotnet publish apps/desktop/BlogStudio.Windows/BlogStudio.Windows.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: BlogStudio-win-x64
          path: publish/win-x64
          retention-days: 14

      # 릴리스(main)와 같은 방식으로 설치 프로그램이 만들어지는지 PR에서 미리 확인 (업로드는 안 함)
      - name: Velopack 패키징 시험
        shell: bash
        run: |
          dotnet publish apps/desktop/BlogStudio.Windows/BlogStudio.Windows.csproj -c Release -r win-x64 --self-contained true -p:Version=0.0.1 -o publish/vpk-src
          dotnet tool install -g vpk --version 1.2.161
          vpk pack -u BlogStudio -v 0.0.1 -p publish/vpk-src -e BlogStudio.exe --packTitle "Blog Studio" -o publish/releases
          ls publish/releases
