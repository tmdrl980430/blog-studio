name: web-pages

# main에 웹·공통 파일이 바뀌면 GitHub Pages에 올린다: https://tmdrl980430.github.io/blog-studio/
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "shared/**", ".github/workflows/web-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE: /blog-studio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
