name: 맛집·카페
memo_hint: "가게 이름, 위치(동네), 먹은 메뉴와 가격, 맛·분위기·웨이팅, 아쉬운 점"
guide: >
  메모 후기: 한 줄 평 → ## 가게 정보 (표: 상호, 위치, 영업시간, 주차 — 메모에 없으면 '(확인 필요)')
  → ## 메뉴와 맛 (메뉴별로) → ## 분위기·웨이팅 → ## 아쉬운 점 → ## 이런 분께 추천.
  정보 글: 주제에 맞는 고르는 기준·팁 위주. 특정 가게를 직접 가 본 것처럼 쓰지 않음.
topics:
  - 처음 가는 동네에서 실패 없는 맛집 고르는 법 — 리뷰 볼 때 체크할 것
  - 카페 메뉴 용어 정리 — 라떼, 플랫화이트, 코르타도 차이
  - 웨이팅 맛집 덜 기다리는 요령 — 원격 줄서기·시간대
  - 회식·모임 장소 고를 때 확인할 것 체크리스트
  - 디저트 카페 고르는 기준 — 구움과자·케이크 종류 정리
  - 혼밥하기 좋은 식당의 조건
  - 원두 고르는 법 — 산미·바디·로스팅 단계
  - 데이트 코스 식당 예약 팁 — 기념일 예약·코스 요리
  - 배달 음식 덜 실패하는 리뷰 읽는 법
  - 계절별 제철 음식 정리 — 겨울
  - 오마카세 처음 갈 때 알아 둘 것
  - 노키즈존·반려동물 동반 식당 확인하는 법
