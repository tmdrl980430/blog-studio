name: 패션·코디
memo_hint: "오늘 입은 아이템(상의·하의·아우터·신발), 브랜드·사이즈, 키·체형, 코디 포인트"
guide: >
  메모 후기: 코디 한 줄 요약 → ## 아이템 (표: 부위, 아이템, 브랜드, 사이즈) → ## 코디 포인트
  → ## 사이즈 팁 (메모의 키·체형 기준) → ## 비슷하게 입으려면.
  정보 글: 계절·상황별 코디 원칙, 아이템 고르는 기준, 관리법 중심. 특정 상품을 산 것처럼 쓰지 않음.
topics:
  - 겨울 아우터 종류 정리 — 패딩, 코트, 무스탕 고르는 기준
  - 남자 기본 코디 색 조합 공식
  - 니트 소재별 특징과 보풀 관리법
  - 내 체형에 맞는 바지 핏 고르는 법
  - 출근룩 기본 아이템 10가지
  - 운동화 세탁·관리법
  - 레이어드 코디 기본 — 계절 바뀔 때
  - 셔츠 사이즈 제대로 보는 법 — 어깨·소매·총장
  - 결혼식 하객룩 기본 규칙
  - 옷장 정리와 계절 옷 보관법
  - 온라인 쇼핑 사이즈 실패 줄이는 법 — 실측 보는 법
  - 데일리 백 고르는 기준
