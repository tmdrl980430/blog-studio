name: 여행·일상
memo_hint: "간 곳·날짜, 동선, 교통·비용, 좋았던 순간, 다음에 바꿀 점"
guide: >
  메모 후기: 한 줄 요약 → ## 일정 한눈에 (표: 시간/장소/메모) → 장소별 ## 소제목
  → ## 교통·비용 정리 (표) → ## 다음에 간다면.
  정보 글: 준비물·예산·동선처럼 바로 써먹을 수 있는 체크리스트 중심.
topics:
  - 1박 2일 국내 여행 준비물 체크리스트
  - 해외여행 환전·카드 정리 — 트래블카드 고르는 기준
  - 비행기 표 싸게 사는 시기와 요령
  - 여행 사진 잘 찍는 스마트폰 설정
  - 당일치기 여행 동선 짜는 법
  - 해외여행 유심 vs eSIM vs 로밍 비교
  - 여행 짐 싸기 — 기내 반입 규정 정리
  - 주말에 하기 좋은 서울 근교 산책 코스 고르는 법
  - 여행 경비 정산 쉽게 하는 법
  - 비 오는 날 여행 계획 B 만들기
  - 숙소 고를 때 리뷰에서 꼭 볼 것
  - 퇴근 후 저녁 루틴 만들기
