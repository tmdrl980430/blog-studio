name: 제품 리뷰
memo_hint: "제품명, 구매 가격·구매처, 사용 기간, 좋았던 점, 아쉬운 점, 비교해 본 제품"
guide: >
  메모 후기: 한 줄 평 → ## 제품 정보 (표: 제품명, 가격, 구매처, 사용 기간) → ## 사용기
  → ## 좋았던 점 / 아쉬운 점 (표 또는 목록) → ## 이런 분께 추천.
  정보 글: 고르는 기준, 스펙 읽는 법, 비교표 중심. 써 본 것처럼 쓰지 않음.
topics:
  - 모니터 고르는 기준 — 해상도, 주사율, 패널 종류
  - 기계식 키보드 축 종류 정리
  - 무선 이어폰 고를 때 볼 스펙 — 코덱, 노이즈 캔슬링
  - 노트북 살 때 확인할 것 — CPU, 램, 무게
  - 데스크 셋업 기본 — 모니터암, 조명, 의자
  - 보조배터리 용량과 기내 반입 기준
  - 로봇청소기 고르는 기준
  - 전동칫솔 종류 비교 — 음파 vs 회전
  - 스마트워치 고르는 기준
  - 공기청정기 CADR와 필터 정리
  - 가성비 마우스 고르는 법 — 센서, 무게, 그립
  - 커피머신 종류 비교 — 캡슐, 반자동, 전자동
